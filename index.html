<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>APP_NAME</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APP_NAME">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="APP_NAME">
<meta property="og:description" content="APP_DESCRIPTION">
<meta property="og:image" content="/icon-512.png">
<meta property="og:locale" content="he_IL">

<!-- Guard: redirect to landing if not installed as PWA -->
<script>
  var isStandalone =
    window.navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches ||
    window.location.search.includes('pwa=1');
  if (!isStandalone) {
    window.location.replace('/landing.html');
  }
</script>

<style>
  :root {
    --bg:        #0b0f1a;
    --surface:   #111929;
    --card:      #1a2236;
    --card-hover:#1f2a42;
    --primary:   #4d8eff;
    --accent:    #00d4aa;
    --border:    rgba(255,255,255,0.07);
    --text:      #e8eef8;
    --muted:     #8a96b8;
    --radius:    18px;
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* HEADER */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #header h1 {
    font-size: 18px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.4px;
  }

  /* CONTENT */
  #main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 16px;
  }

  /* BOTTOM NAV */
  #bottom-nav {
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 0 8px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.18s;
  }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.active { color: var(--primary); }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 76px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.25s;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  #toast.show { opacity: 1; }

  /* iOS INSTALL OVERLAY */
  #iosInstallOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    align-items: flex-end;
    direction: rtl;
  }
  @keyframes _iosSlideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  .ios-sheet {
    background: #141820;
    border-radius: 28px 28px 0 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 20px 20px 48px;
    width: 100%;
    animation: _iosSlideUp 0.35s cubic-bezier(0.34,1.4,0.64,1);
  }
  .ios-step {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .ios-step-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(77,142,255,0.15);
    border: 1px solid rgba(77,142,255,0.3);
    color: #4d8eff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900; flex-shrink: 0;
  }

  /* PLACEHOLDER — מחק ומלא בתוכן */
  .placeholder-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }
  .placeholder-screen svg { width: 56px; height: 56px; opacity: 0.25; }
  .placeholder-screen p { font-size: 15px; }
</style>
</head>
<body>

<!-- iOS Install Overlay -->
<div id="iosInstallOverlay">
  <div class="ios-sheet">
    <div style="width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:4px;margin:0 auto 20px;"></div>
    <div style="font-size:20px;font-weight:900;text-align:center;margin-bottom:4px;color:#e8eef8;">📲 הוסף למסך הבית</div>
    <div style="font-size:13px;color:#5a7090;text-align:center;margin-bottom:20px;line-height:1.5;">פשוט שתף והוסף!</div>
    <div class="ios-step"><div class="ios-step-num">1</div><div style="font-size:13px;line-height:1.4;color:#e8eef8;">לחץ/י על <strong>שתף ⎙</strong> בתחתית Safari</div></div>
    <div class="ios-step"><div class="ios-step-num">2</div><div style="font-size:13px;line-height:1.4;color:#e8eef8;">בחר/י <strong>"הוסף למסך הבית"</strong></div></div>
    <div class="ios-step"><div class="ios-step-num">3</div><div style="font-size:13px;line-height:1.4;color:#e8eef8;">לחץ/י <strong>"הוסף"</strong> ✅</div></div>
    <button onclick="document.getElementById('iosInstallOverlay').style.display='none'" style="
      margin-top:10px;width:100%;padding:15px;border:none;border-radius:14px;
      font-size:15px;font-weight:800;font-family:inherit;color:#fff;cursor:pointer;
      background:linear-gradient(135deg,#4d8eff,#a55eea);
    ">הבנתי 🎉</button>
  </div>
</div>

<div id="toast"></div>

<div id="app">

  <header id="header">
    <h1>APP_NAME</h1>
    <button onclick="showToast('תפריט')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
        <line x1="4" y1="6"  x2="20" y2="6"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="18" x2="20" y2="18"/>
      </svg>
    </button>
  </header>

  <main id="main">

    <!-- SCREEN: HOME -->
    <div class="screen active" id="screen-home">
      <div class="placeholder-screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <p>מסך ראשי</p>
        <p style="font-size:12px;opacity:0.5;">הוסף תוכן כאן</p>
      </div>
    </div>

    <!-- SCREEN: TWO -->
    <div class="screen" id="screen-two">
      <div class="placeholder-screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>מסך שני</p>
      </div>
    </div>

    <!-- SCREEN: THREE -->
    <div class="screen" id="screen-three">
      <div class="placeholder-screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <p>פרופיל</p>
      </div>
    </div>

  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-screen="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      בית
    </button>
    <button class="nav-btn" data-screen="two">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      חיפוש
    </button>
    <button class="nav-btn" data-screen="three">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      פרופיל
    </button>
  </nav>

</div>

<script>
// SERVICE WORKER
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(e => console.warn('[SW]', e));
  });
}

// iOS OVERLAY
if (window.location.search.includes('install=1')) {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('iosInstallOverlay').style.display = 'flex';
  });
}

// SCREEN MANAGER
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const screen = document.getElementById('screen-' + id);
  const btn    = document.querySelector(`.nav-btn[data-screen="${id}"]`);
  if (screen) screen.classList.add('active');
  if (btn)    btn.classList.add('active');
  window.scrollTo(0, 0);
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => showScreen(btn.dataset.screen));
});

// TOAST
function showToast(msg, duration = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

// PWA INSTALL — Android
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredPrompt = e;
});
async function promptInstall() {
  if (_deferredPrompt) {
    _deferredPrompt.prompt();
    await _deferredPrompt.userChoice;
    _deferredPrompt = null;
  }
}
</script>

</body>
</html>
